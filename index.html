<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TravelTime</title>
  <meta name="description" content="Los lugares que has visitado en el mundo, con lo que hiciste en cada uno.">
  <meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/css/story.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    /* Paleta: tierra y agua frias y calmadas, para que lo visitado (coral) sea lo
       unico que llama la atencion. El mismo coral marca progreso en el panel. */
    :root {
      --bg: #eef2f5;
      --space: radial-gradient(120% 90% at 50% 40%, #dfe8f0 0%, #c9d6e2 55%, #b4c4d4 100%);
      --card: rgba(255, 255, 255, 0.78);
      --card-solid: #ffffff;
      --ink: #172033;
      --muted: #5b6678;
      --line: rgba(23, 32, 51, 0.1);
      --accent: #f2545b;
      --accent-2: #ff9a62;
      --accent-ink: #ffffff;
      --halo: rgba(255, 255, 255, 0.92);
      --map-land: #f6f4ef;
      --map-water: #bcd9ea;
      --map-visited: #f2545b;
      --map-visited-alpha: 0.55;
      --map-selected: #c81e3a;
      --map-hover: #f2545b;
      --map-hover-alpha: 0.14;
      --map-idle: #8793a6;
      --map-idle-alpha: 0.04;
      --map-line: #6c7a90;
      --sky: #cfe0ee;
      --horizon: #ffffff;
      --shadow: 0 10px 30px rgba(23, 32, 51, 0.14), 0 1px 3px rgba(23, 32, 51, 0.08);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1020;
        --space: radial-gradient(120% 90% at 50% 40%, #16213d 0%, #0b1020 60%, #05070f 100%);
        --card: rgba(20, 27, 46, 0.78);
        --card-solid: #141b2e;
        --ink: #e8ecf4;
        --muted: #98a3b8;
        --line: rgba(232, 236, 244, 0.1);
        --accent: #ff6b6b;
        --accent-2: #ffa36c;
        --accent-ink: #1a0f12;
        --halo: rgba(11, 16, 32, 0.9);
        --map-land: #1a2236;
        --map-water: #0d1527;
        --map-visited: #ff6b6b;
        --map-visited-alpha: 0.55;
        --map-selected: #ffc1b4;
        --map-hover: #ff8f8f;
        --map-hover-alpha: 0.14;
        --map-idle: #b6c0d4;
        --map-idle-alpha: 0.03;
        --map-line: #7d8aa5;
        --sky: #0b1020;
        --horizon: #1d2b52;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b1020;
      --space: radial-gradient(120% 90% at 50% 40%, #16213d 0%, #0b1020 60%, #05070f 100%);
      --card: rgba(20, 27, 46, 0.78);
      --card-solid: #141b2e;
      --ink: #e8ecf4;
      --muted: #98a3b8;
      --line: rgba(232, 236, 244, 0.1);
      --accent: #ff6b6b;
      --accent-2: #ffa36c;
      --accent-ink: #1a0f12;
      --halo: rgba(11, 16, 32, 0.9);
      --map-land: #1a2236;
      --map-water: #0d1527;
      --map-visited: #ff6b6b;
      --map-visited-alpha: 0.55;
      --map-selected: #ffc1b4;
      --map-hover: #ff8f8f;
      --map-hover-alpha: 0.14;
      --map-idle: #b6c0d4;
      --map-idle-alpha: 0.03;
      --map-line: #7d8aa5;
      --sky: #0b1020;
      --horizon: #1d2b52;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; color: inherit; }

    #map { position: fixed; inset: 0; background: var(--space); }

    .glass {
      background: var(--card);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    /* Barra de arriba: marca, busqueda, estilo y migas */
    .top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 2;
      padding: max(12px, env(safe-area-inset-top)) 16px 0;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .top > * { pointer-events: auto; }
    .bar-row { display: flex; gap: 8px; align-items: center; max-width: 520px; }
    .brand {
      flex: none; width: 44px; height: 44px; border-radius: 14px;
      display: grid; place-items: center; font-size: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; box-shadow: var(--shadow);
    }
    .search { position: relative; flex: 1; min-width: 0; }
    .search input {
      width: 100%; height: 44px; padding: 0 14px 0 38px; border-radius: 14px;
      color: var(--ink); font: inherit; outline: none;
    }
    .search > svg {
      position: absolute; left: 13px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
      z-index: 1; /* el input con backdrop-filter se pinta encima si no */
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
    .results {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--card-solid); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow); max-height: 50vh; overflow: auto;
      margin: 0; padding: 6px; list-style: none;
    }
    .results:empty { display: none; }
    .results button {
      width: 100%; text-align: left; border: 0; background: none;
      padding: 8px 10px; border-radius: 10px; cursor: pointer;
    }
    .results button:hover, .results button[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .results small { color: var(--muted); display: block; font-size: 12px; }
    .style-pick {
      flex: none; height: 44px; border-radius: 14px; padding: 0 10px; cursor: pointer; outline: none;
    }
    .style-pick option { background: var(--card-solid); color: var(--ink); }
    @media (max-width: 480px) {
      .style-pick { max-width: 96px; font-size: 13px; padding: 0 6px; }
    }

    .crumbs {
      display: flex; flex-wrap: wrap; gap: 2px; align-items: center;
      max-width: max-content; border-radius: 999px; padding: 3px 6px; font-size: 13px;
    }
    .crumbs button { border: 0; background: none; padding: 4px 9px; border-radius: 999px; cursor: pointer; }
    .crumbs button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .crumbs button[aria-current] { font-weight: 650; cursor: default; color: var(--accent); }
    .crumbs span { color: var(--muted); }

    /* Panel: abajo en el telefono, a la izquierda en pantalla grande */
    .panel {
      position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
      max-height: 46vh; overflow: auto;
      border-radius: 22px 22px 0 0; border-bottom: 0;
      padding: 18px 18px max(18px, env(safe-area-inset-bottom));
    }
    .panel::before {
      content: ""; display: block; width: 38px; height: 4px; border-radius: 2px;
      background: var(--line); margin: -8px auto 12px;
    }
    @media (min-width: 820px) {
      .panel {
        top: 124px; bottom: 16px; left: 16px; right: auto; width: 370px; max-height: none;
        border-radius: 22px; border-bottom: 1px solid var(--line);
      }
      .panel::before { display: none; }
    }
    .panel h1 { font-size: 24px; line-height: 1.15; margin: 0 0 14px; letter-spacing: -0.01em; }
    .panel .kind {
      color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 0.08em;
      text-transform: uppercase; margin: 0 0 4px;
    }
    .big { font-size: 15px; margin: 0 0 12px; color: var(--muted); }
    .big b { font-size: 34px; color: var(--ink); margin-right: 4px; letter-spacing: -0.02em; }
    .stat { margin: 0 0 14px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
    .stat-row b { color: var(--ink); font-size: 16px; }
    .pct { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); }
    .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar i {
      display: block; height: 100%; min-width: 0; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.5s ease;
    }
    .list { list-style: none; margin: 4px 0 0; padding: 0; }
    .list button {
      width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      border: 0; background: none; border-radius: 10px;
      padding: 9px 10px; text-align: left; cursor: pointer;
    }
    .list button:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .list .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; opacity: 0.6; }
    .list .dot.on {
      background: var(--accent); border-color: var(--accent); opacity: 1;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .primary, .secondary { border-radius: 12px; padding: 11px 18px; cursor: pointer; font-weight: 650; }
    .primary {
      border: 0; color: var(--accent-ink);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .primary:hover { filter: brightness(1.05); }
    .secondary { border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: none; color: var(--accent); }
    .note { color: var(--muted); font-size: 13px; }
    .placeholder {
      margin-top: 16px; padding: 14px; border: 1px dashed var(--line); border-radius: 14px;
      color: var(--muted); font-size: 13px;
    }

    /* Cuenta */
    .bar-row { max-width: 600px; }
    .account {
      flex: none; height: 44px; min-width: 44px; padding: 0 14px; border-radius: 14px;
      cursor: pointer; font-weight: 650;
    }
    .account.avatar {
      padding: 0; border-radius: 50%; border: 0; color: #fff; font-size: 17px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    @media (max-width: 480px) {
      .brand { display: none; }
    }

    /* Panel alto: leer y escribir una visita necesita espacio */
    @media (max-width: 819px) {
      .panel.tall { max-height: 82vh; }
    }

    /* Visitas */
    .visits:empty { display: none; }
    .visits { margin: 18px 0 8px; }
    .visits-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .visits-head h2, .modal h2 { font-size: 16px; margin: 0; }
    .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .card {
      width: 100%; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
      padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
      background: color-mix(in srgb, var(--card-solid) 70%, transparent);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); transform: translateY(-1px); }
    .card-title { font-weight: 650; }
    .card-sub { font-size: 13px; color: var(--muted); }
    .back { margin: 0 0 12px; }

    /* Galeria */
    .card.with-cover { padding: 0 0 12px; overflow: hidden; }
    .card.with-cover .card-title, .card.with-cover .card-sub { padding: 0 14px; }
    .card-cover { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; margin-bottom: 10px; background: var(--line); }
    .gallery { margin: 18px 0 4px; }
    .gallery .count { color: var(--muted); font-weight: 500; }
    .add-photo { cursor: pointer; display: inline-block; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .tile {
      aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; overflow: hidden; cursor: zoom-in;
      background: var(--line); position: relative;
    }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s ease; }
    .tile:hover img { transform: scale(1.04); }
    .tile.uploading { display: grid; place-items: center; cursor: default; font-size: 12px; color: var(--muted); text-align: center; padding: 6px; }
    .tile.uploading::before {
      content: ""; position: absolute; inset: 0; border-radius: 10px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 18%, transparent), transparent);
      background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
    }
    .tile.uploading.err { color: #d92d3a; }
    .tile.uploading.err::before { animation: none; background: color-mix(in srgb, #d92d3a 10%, transparent); }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .lightbox {
      position: fixed; inset: 0; z-index: 15; background: rgba(5, 7, 15, 0.94);
      display: grid; place-items: center; padding: 56px 16px 16px;
    }
    .lightbox figure { margin: 0; max-width: min(1400px, 100%); display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .lightbox img { max-width: 100%; max-height: calc(100vh - 170px); object-fit: contain; border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    .lightbox figcaption { width: min(640px, 100%); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: #c9d1e0; }
    .lb-caption {
      flex: 1 1 100%; font: inherit; color: #fff; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px; padding: 9px 12px; outline: none;
    }
    .lb-caption:focus { border-color: var(--accent); }
    .lb-meta { font-size: 13px; }
    .lightbox .danger-link { color: #ff8a8a; }
    .lb-close, .lb-nav {
      position: fixed; border: 0; cursor: pointer; color: #fff; background: rgba(255, 255, 255, 0.12);
      width: 44px; height: 44px; border-radius: 50%; font-size: 22px; display: grid; place-items: center;
    }
    .lb-close { top: 12px; right: 12px; font-size: 18px; }
    .lb-nav { top: 50%; transform: translateY(-50%); font-size: 30px; }
    .lb-nav.prev { left: 12px; }
    .lb-nav.next { right: 12px; }
    .lb-close:hover, .lb-nav:hover { background: rgba(255, 255, 255, 0.22); }

    /* Lugares */
    .pins:empty { display: none; }
    .pins { margin: 18px 0 4px; }
    .pin-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .pin-list button {
      width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; cursor: pointer;
      border: 0; background: none; padding: 8px; border-radius: 12px;
    }
    .pin-list button:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .pin-list small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
    .pin-emoji, .pin-kind {
      flex: none; display: inline-grid; place-items: center; border-radius: 10px;
      background: color-mix(in srgb, var(--k) 18%, transparent);
    }
    .pin-emoji { width: 32px; height: 32px; font-size: 16px; }
    .pin-kind { padding: 2px 8px; font-size: 12px; font-weight: 650; color: var(--k); justify-self: start; }
    .pin-card { display: grid; gap: 6px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
    .pin-card strong { font-size: 15px; }
    .pin-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .pin-actions { display: flex; gap: 10px; }
    .pin-actions .danger-link { margin-left: auto; }
    .pin-popup .maplibregl-popup-content {
      background: var(--card-solid); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    .pin-popup .maplibregl-popup-tip { border-top-color: var(--card-solid) !important; border-bottom-color: var(--card-solid) !important; }
    .pin-popup .maplibregl-popup-close-button { color: var(--muted); font-size: 18px; padding: 2px 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip input { position: absolute; opacity: 0; pointer-events: none; }
    .chip span {
      display: inline-block; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--ink);
      border: 1px solid var(--line); background: var(--card-solid);
    }
    .chip input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 650; }
    .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .coords { font-variant-numeric: tabular-nums; margin: 0 0 8px; }
    .link.light { color: #ffb0a0; }
    .secondary.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
    .pick-bar {
      position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: 24px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
      padding: 10px 14px; border-radius: 16px; max-width: calc(100vw - 32px); font-size: 14px;
    }
    /* Eligiendo un punto: el panel se aparta para dejar ver el mapa */
    body.picking .panel { opacity: 0.25; pointer-events: none; }
    @media (max-width: 819px) {
      body.picking .panel { transform: translateY(calc(100% - 40px)); opacity: 1; transition: transform 0.25s ease; }
    }

    /* Formularios */
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; font-size: 13px; color: var(--muted); font-weight: 550; }
    .field input, .field textarea {
      font: inherit; font-size: 15px; color: var(--ink); background: var(--card-solid);
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: none; width: 100%;
    }
    .field textarea { resize: vertical; min-height: 160px; line-height: 1.55; }
    .field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-error { color: var(--map-selected); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 8px 12px; border-radius: 10px; font-size: 13.5px; margin: 0 0 12px; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
    .actions.start { justify-content: flex-start; }
    .primary.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
    .primary.wide, .secondary.wide { width: 100%; }
    .primary:disabled, .secondary:disabled, .danger:disabled { opacity: 0.6; cursor: progress; }
    .danger { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 650; cursor: pointer; background: #d92d3a; color: #fff; }
    .danger-link, .link { border: 0; background: none; cursor: pointer; padding: 6px 4px; font-weight: 600; }
    .danger-link { color: #d92d3a; margin-left: auto; }
    .link { color: var(--accent); }
    .switch { text-align: center; font-size: 13.5px; color: var(--muted); margin: 14px 0 0; }
    .reason { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .code {
      font: 700 22px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 3px; text-align: center;
      padding: 18px; margin: 14px 0 4px; border-radius: 14px; border: 1px dashed var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, transparent); user-select: all;
    }
    .inline-form { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }

    /* Ventanas y avisos */
    .modal-back {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; /* encima de la foto en grande */
      background: rgba(8, 12, 24, 0.45); opacity: 0; transition: opacity 0.2s ease;
    }
    .modal-back.show { opacity: 1; }
    .modal {
      width: min(420px, 100%); max-height: calc(100vh - 32px); overflow: auto;
      background: var(--card-solid); border: 1px solid var(--line); border-radius: 22px;
      box-shadow: var(--shadow); padding: 22px; transform: translateY(8px); transition: transform 0.2s ease;
    }
    .modal-back.show .modal { transform: none; }
    .modal h2 { font-size: 20px; margin-bottom: 10px; }
    .toast {
      position: fixed; z-index: 30; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
      background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 550;
      box-shadow: var(--shadow); transition: opacity 0.25s ease, transform 0.25s ease; max-width: calc(100vw - 32px);
    }
    .toast.err { background: #d92d3a; color: #fff; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (min-width: 820px) {
      .toast { left: auto; right: 24px; transform: translateY(20px); }
      .toast.show { transform: none; }
    }

    .maplibregl-ctrl-attrib { font-size: 11px; }
    .maplibregl-ctrl-group { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow) !important; }
